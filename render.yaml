# One-click deploy config for Render (render.com).
# The service needs the whole repository, because it imports ml/features.py
# and loads models/model.json.
services:
  - type: web
    name: staysignal-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
